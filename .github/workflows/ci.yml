name: Wisecow CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'PS1/wisecow/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rahulsharma2109/wisecow

jobs:

  build-and-push:
    name: Build and Push Wisecow Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./PS1/wisecow
          file: ./PS1/wisecow/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy Wisecow to Minikube
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Verify Kubernetes cluster
        run: |
          kubectl get nodes
          kubectl get deployment wisecow

      - name: Update Wisecow image
        run: |
          kubectl set image deployment/wisecow \
            wisecow=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/wisecow --timeout=180s

      - name: Verify deployed pods
        run: |
          kubectl get deployment wisecow
          kubectl get pods -o wide
          kubectl get service wisecow

      - name: Test Wisecow application
        run: |
          curl -k --fail https://wisecow.local
